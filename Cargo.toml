[package]
name = "cdr"
version = "0.1.0"
edition = "2021"
description = "CDR (Content Disarm & Reconstruction) - 오피스/PDF 문서 재조합 엔진"
license = "MIT"

[lib]
name = "cdr"
path = "src/lib.rs"

[[bin]]
name = "cdr"
path = "src/main.rs"

[dependencies]
lopdf = "0.45"
quick-xml = "0.42"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hayro = "0.7"
ttf-parser = "0.25"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
cfb = "0.15"
flate2 = "1"
uuid = "1"
toml = "1"

[profile.release]
opt-level = 3
lto = true
panic = "unwind"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
