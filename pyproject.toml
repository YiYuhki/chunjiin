[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdr"
version = "0.1.0"
description = "CDR (Content Disarm & Reconstruction) 문서 보안 엔진"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pikepdf>=8.0",
    "Pillow>=10.0",
    "lxml>=4.9",
    "olefile>=0.46",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "cdr[api]",
]

[project.scripts]
cdr = "cdr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
